# Copy to ~/.config/tkt/config.toml (or let `tkt init` write it).
# Secrets never go here: store the Jira token with `tkt auth jira`.

# Folders where tkt looks for local clones of the repositories below.
repo_roots = ["~/dev/work"]

# Review requests on the board: "direct" (asked of you, default), "team" (also your teams, e.g. CODEOWNERS
# and dependabot), or "off" (only your assigned tickets).
reviews = "direct"

[jira]
site = "example.atlassian.net"
email = "you@example.com"
# Optional: a Jira field whose value the board shows for the selected ticket, such as its product.
# label_field = "Product"

# Optional: the gh account that reads each GitHub organization (`gh auth status` lists them).
# Without it, tkt detects the logged-in account that belongs to the organization.
[github.accounts]
example-org = "your-gh-user"

[context]
comments = 5

[[spaces]]
key = "DEMO"
name = "Demo space"
# Optional custom field holding acceptance criteria.
# acceptance_field = "customfield_10042"

# Board column for statuses Jira's own category gets wrong: todo, in_progress, review or done.
[spaces.status_overrides]
"Code Review" = "review"

# Optional: tkt infers each space's repositories from the pull requests Jira links to your tickets.
# List them here to add one with no pull requests yet, or to set its local path.
[[spaces.repos]]
repo = "example-org/web"

[[spaces.repos]]
repo = "example-org/api"
# path = "~/src/api"   # only when the clone lives outside repo_roots
